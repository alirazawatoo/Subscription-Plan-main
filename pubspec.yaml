name: flutter_stacked_starter
description: Subscription plan picker built with Flutter and the Stacked MVVM architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Stacked State Management
  stacked: ^3.5.0
  stacked_services: ^1.6.0

  # UI
  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0

  # Network
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.1
  stacked_generator: ^2.0.4

flutter:
  uses-material-design: true

  assets:
    - db.json
